<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5d6678; --line:#d9dde5; --acc:#c62828; --ok:#1a7f37; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; background:#1d2330; color:#fff; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header input { width:260px; padding:5px 8px; border-radius:4px; border:0; }
  header button { padding:5px 10px; }
  main { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .trips button { display:block; width:100%; text-align:left; padding:9px 10px; margin:0 0 6px;
                  border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; font:inherit; }
  .trips button.active { border-color:var(--acc); background:#fdeeee; font-weight:600; }
  .trips button:disabled { opacity:.6; cursor:wait; }
  table { border-collapse:collapse; width:100%; }
  td, th { padding:5px 6px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--muted); font-weight:600; }
  .big { font-size:26px; font-weight:700; color:var(--ok); }
  #status { color:var(--muted); margin:6px 0; min-height:20px; }
  #status.err { color:var(--acc); }
  iframe { width:100%; height:620px; border:1px solid var(--line); border-radius:6px; background:#eee; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>PathSnap &mdash; Map-Matching Evaluator</h1>
  <label>API URL <input id="api" placeholder="http://192.168.x.x:8000"></label>
  <button id="connect">Connect</button>
  <span id="health" class="muted"></span>
</header>
<main>
  <section>
    <div class="card">
      <b>Evaluation trips</b>
      <div class="muted">Select a trip; the ID is sent to the API, which runs the full pipeline.</div>
      <div id="trips" class="trips" style="margin-top:10px"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <b>Results</b>
      <div id="status"></div>
      <div id="results" class="muted">No trip evaluated yet.</div>
    </div>
  </section>
  <section class="card">
    <b>Predicted route</b> <span class="muted">(Folium map returned by the API: raw GPS, nearby network, predicted route)</span>
    <iframe id="map" title="Predicted route map"></iframe>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
